<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — PolyCGPA</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="login-wrap">
        <div class="login-card">
            <div style="text-align: center; margin-bottom: 24px;">
                <a href="index.html" class="logo" style="justify-content: center; margin-bottom: 14px;">
                    <span class="logo-icon">Σ</span>
                    <span>Poly<span>CGPA</span></span>
                </a>
                <h1 style="font-size: 20px; font-weight: 700; margin-bottom: 4px;">Student Sign In</h1>
                <p style="font-size: 13px; color: var(--text-muted);">Enter your username and password to continue</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" class="form-control" placeholder="e.g. rahul" required autofocus>
                </div>

                <div class="form-group" style="margin-bottom: 22px;">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Enter password" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    Sign In →
                </button>
            </form>

            <div style="text-align: center; margin-top: 18px;">
                <a href="index.html" style="font-size: 13px; color: var(--text-muted);">
                    ← Back to Home
                </a>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/app.js"></script>
    <script>
        document.getElementById("loginForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const username = document.getElementById("username").value.trim();
            if (username) {
                localStorage.setItem("polycgpa_user", username);
                window.location.href = "index.html";
            }
        });
    </script>
</body>
</html>
