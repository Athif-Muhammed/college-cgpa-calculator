<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — PolyCGPA</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Simple Navbar -->
    <header class="navbar">
        <a href="index.html" class="logo">
            <span class="logo-icon">CT</span>
            <span>Poly<span>CGPA</span></span>
        </a>

    </header>

    <!-- Login Content -->
    <main class="login-wrap">
        <div class="login-box">
            <h1 style="font-size: 22px; font-weight: 800; margin-bottom: 6px;">Student Sign In</h1>
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 22px;">Diploma in Computer Engineering</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username / Student Name</label>
                    <input type="text" id="username" class="form-control" placeholder="Enter your name" required autofocus>
                </div>

                <div class="form-group" style="margin-bottom: 20px;">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Enter password" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    Sign In →
                </button>
            </form>

            <div style="margin-top: 18px;">
                <a href="index.html" style="font-size: 13px; color: var(--text-muted);">← Back to Home</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>PolyCGPA — Diploma in Computer Engineering (Revision 2021)</p>
    </footer>

    <!-- Scripts -->
    <script src="js/app.js"></script>
    <script>
        document.getElementById("loginForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const username = document.getElementById("username").value.trim();
            if (!username) {
                alert("Please enter a valid username.");
                return;
            }

            // Print alert using JS
            alert("Signed in successfully! Welcome, " + username + ".");

            // Save login state in localStorage
            localStorage.setItem("polycgpa_user", username);

            // Redirect to home
            window.location.href = "index.html";
        });
    </script>
</body>
</html>
